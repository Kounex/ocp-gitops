apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudflared

resources:
  - namespace.yml
  - external-secret.yml
  - deployment.yml

# The hash suffix rolls the Deployment whenever the rules change;
# cloudflared does not reload its config file on its own.
configMapGenerator:
  - name: cloudflared-config
    files:
      - config.yaml
