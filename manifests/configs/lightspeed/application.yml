apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lightspeed-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '100'
spec:
  # Adopted from a hand install (2026-11-12) on 2026-11-26. Operator objects,
  # DSC/DSCI, OLSConfig, PVCs, the model and Jobs carry Prune=false.
  source:
    path: manifests/configs/lightspeed/apps
    repoURL: https://github.com/Kounex/ocp-gitops.git
    targetRevision: main
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: configs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
