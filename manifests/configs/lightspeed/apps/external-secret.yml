# Lightspeed's LLM credential for the AI lab's model server, from Doppler
# (project ocp, config main) since 2026-11-26; same key as the server's
# showcase-models/model-api-key. Before the OLSConfig (140) that reads it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: showcase-model-credentials
  namespace: openshift-lightspeed
  labels:
    app.kubernetes.io/part-of: ai-lightspeed-showcase
  annotations:
    argocd.argoproj.io/sync-wave: '130'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: showcase-model-credentials
    creationPolicy: Owner
  data:
    - secretKey: apitoken
      remoteRef:
        key: AI_LAB_MODEL_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: AI_LAB_MODEL_API_KEY
