kind: OAuth
apiVersion: config.openshift.io/v1
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: '150'
    argocd.argoproj.io/sync-options: Validate=false,ServerSideApply=true
spec:
  identityProviders:
    - name: Local
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpasswd
  templates:
    login:
      name: login-template
    providerSelection:
      name: provider-template
