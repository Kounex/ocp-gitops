apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '150'
    argocd.argoproj.io/sync-options: Validate=false,ServerSideApply=true,Prune=false
spec:
  notifications:
    enabled: true
  # CPU requests trimmed for the 8 vCPU single-node cluster (operator
  # defaults reserve ~250m per component); limits are the operator defaults.
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
  applicationSet:
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
  repo:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  redis:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: "500m"
        memory: 256Mi
  sso:
    dex:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: "500m"
          memory: 256Mi
  server:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: "500m"
        memory: 256Mi
    route:
      enabled: true
      tls:
        insecureEdgeTerminationPolicy: Redirect
        termination: reencrypt
