# Operand config for the Red Hat External Secrets Operator. Its controller
# only gets the network access its NetworkPolicies allow; Doppler is an
# external HTTPS API, so egress is open.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    app: external-secrets-operator
    app.kubernetes.io/name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: '130'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  controllerConfig:
    networkPolicies:
      - componentName: ExternalSecretsCoreController
        name: allow-external-secrets-egress
        egress:
          - {}
