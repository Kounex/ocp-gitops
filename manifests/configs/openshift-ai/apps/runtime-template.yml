apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: llamacpp-cpu-showcase
  namespace: redhat-ods-applications
  labels:
    opendatahub.io/dashboard: 'true'
  annotations:
    description: Pinned compact community CPU runtime for a small quantized model.
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["generative"]'
    opendatahub.io/modelServingSupport: '["single"]'
    openshift.io/display-name: llama.cpp CPU — Qwen3 Q8 (lab)
    argocd.argoproj.io/sync-wave: '140'
objects:
  - apiVersion: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    metadata:
      annotations:
        opendatahub.io/accelerator-name: ''
        opendatahub.io/apiProtocol: REST
        opendatahub.io/model-type: generative
        opendatahub.io/serving-runtime-scope: global
        opendatahub.io/template-display-name: llama.cpp CPU — Qwen3 Q8 (lab)
        opendatahub.io/template-name: llamacpp-cpu
        openshift.io/display-name: llama.cpp CPU — Qwen3 Q8 (lab)
      labels:
        opendatahub.io/dashboard: 'true'
      name: llamacpp-cpu
    spec:
      containers:
        - args:
            - --model
            - /mnt/models/Qwen3-0.6B-Q8_0.gguf
            - --alias
            - Qwen/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - '8000'
            - --ctx-size
            - '8192'
            - --threads
            - '2'
            - --threads-batch
            - '2'
            - --parallel
            - '1'
            - --batch-size
            - '256'
            - --ubatch-size
            - '128'
            - --jinja
            - --chat-template-kwargs
            - '{"enable_thinking":false}'
            - --reasoning-budget
            - '0'
            - --no-webui
          command:
            - /app/llama-server
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  key: api-key
                  name: model-api-key
            - name: HOME
              value: /tmp
          image: ghcr.io/ggml-org/llama.cpp@sha256:2a371435461d0ce320c7103960c673b1976e07b230f470d9714fd0bec5a31d4e
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
          name: kserve-container
          ports:
            - containerPort: 8000
              name: http1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 1Gi
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
      multiModel: false
      supportedModelFormats:
        - autoSelect: true
          name: GGUF
