---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: showcase-registry-db
  namespace: rhoai-model-registries
  annotations:
    argocd.argoproj.io/sync-wave: '110'
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: lvms-vg1
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-registry-db
  namespace: rhoai-model-registries
  annotations:
    argocd.argoproj.io/sync-wave: '110'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: showcase-registry-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-registry-db
  namespace: rhoai-model-registries
  annotations:
    argocd.argoproj.io/sync-wave: '120'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showcase-registry-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: showcase-registry-db
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: POSTGRESQL_USER
              value: registry
            - name: POSTGRESQL_DATABASE
              value: registry
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: database-password
                  name: showcase-registry-db
            - name: POSTGRESQL_SHARED_BUFFERS
              value: 32MB
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: '50'
          image: registry.redhat.io/rhel9/postgresql-16@sha256:435ba5c1d3f686cf8a45ae525b4d169ced6b33753bcfab99a1498bd9e6e99817
          name: postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /usr/bin/pg_isready
                - -U
                - registry
                - -d
                - registry
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 25m
              memory: 128Mi
          volumeMounts:
            - mountPath: /var/lib/pgsql/data
              name: database
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: showcase-registry-db
---
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  name: showcase-registry
  namespace: rhoai-model-registries
  annotations:
    openshift.io/description: Pinned CPU model provenance for the AI to Lightspeed demo
    openshift.io/display-name: Lightspeed showcase registry
    argocd.argoproj.io/sync-wave: '130'
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  grpc:
    port: 9090
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi
  kubeRBACProxy:
    port: 8443
    routePort: 443
    serviceRoute: enabled
  postgres:
    database: registry
    host: showcase-registry-db
    passwordSecret:
      key: database-password
      name: showcase-registry-db
    port: 5432
    sslMode: disable
    username: registry
  rest:
    port: 8080
    resources:
      limits:
        cpu: 500m
        memory: 384Mi
      requests:
        cpu: 25m
        memory: 128Mi
    serviceRoute: disabled
