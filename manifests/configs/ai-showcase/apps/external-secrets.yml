# The AI lab's Secrets, from Doppler (project ocp, config main) since
# 2026-11-26. They were created by hand on 2026-11-12; ESO took them over
# with the same values. After the namespaces (100), before the registry DB
# (110) and the model server (130) that read them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-api-key
  namespace: showcase-models
  labels:
    app.kubernetes.io/part-of: ai-lightspeed-showcase
  annotations:
    argocd.argoproj.io/sync-wave: '105'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: model-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: AI_LAB_MODEL_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: showcase-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ai-lightspeed-showcase
  annotations:
    argocd.argoproj.io/sync-wave: '105'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: showcase-registry-db
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: AI_LAB_REGISTRY_DB_PASSWORD
