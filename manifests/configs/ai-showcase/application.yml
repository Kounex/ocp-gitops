apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-showcase-app
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '100'
spec:
  # Adopted from a hand install (2026-11-12). No automated sync until the live diff is proven empty.
  source:
    path: manifests/configs/ai-showcase/apps
    repoURL: https://github.com/Kounex/ocp-gitops.git
    targetRevision: main
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: configs
