apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ctfd-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ctfd-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: '{{ .secretKey }}'
        DATABASE_URL: 'mysql+pymysql://ctfd:{{ .dbPassword }}@database:3306/ctfd'
        MARIADB_PASSWORD: '{{ .dbPassword }}'
        MARIADB_ROOT_PASSWORD: '{{ .dbRootPassword }}'
        REDIS_PASSWORD: '{{ .redisPassword }}'
        REDIS_URL: 'redis://:{{ .redisPassword }}@cache:6379/0'
        CTFD_ADMIN_PASSWORD: '{{ .adminPassword }}'
  data:
    - secretKey: secretKey
      remoteRef:
        key: CTFD_SECRET_KEY
    - secretKey: dbPassword
      remoteRef:
        key: CTFD_DB_PASSWORD
    - secretKey: dbRootPassword
      remoteRef:
        key: CTFD_DB_ROOT_PASSWORD
    - secretKey: redisPassword
      remoteRef:
        key: CTFD_REDIS_PASSWORD
    - secretKey: adminPassword
      remoteRef:
        key: CTFD_ADMIN_PASSWORD
