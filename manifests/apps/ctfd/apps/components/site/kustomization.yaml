apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: ctfd
labels:
  - pairs:
      app.kubernetes.io/part-of: ctfd
      app.kubernetes.io/managed-by: kustomize
resources:
  - external-secret.yaml
configMapGenerator:
  - name: ctfd-config
    behavior: merge
    literals:
      - CTFD_ADMIN_EMAIL=contact@kounex.com
patches:
  - path: site.yaml
  - target:
      kind: RoleBinding
      name: ctfd-nonroot
    patch: |-
      - op: add
        path: /subjects/0/namespace
        value: ctfd
