apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app.kubernetes.io/name: ctfd-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ctfd-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctfd-cache
    spec:
      serviceAccountName: ctfd-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
          # Expand inside the container, not into a Kubernetes command argument.
          command: [/bin/sh, -ec]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cache-data
