apiVersion: v1
kind: ConfigMap
metadata:
  name: ctfd-loadtest-fixture
data:
  fixture.py: "\"\"\"Only run against the disposable load-test database and empty installation.\"\"\"\n\
    import json\nimport os\nfrom datetime import datetime, timedelta\nfrom pathlib import Path\n\nfrom\
    \ CTFd import create_app\nfrom CTFd.cache import cache\nfrom CTFd.models import Challenges, Flags,\
    \ Solves, Teams, Users, db\nfrom CTFd.utils import set_config\nfrom CTFd.utils.crypto import hash_password\n\
    from CTFd.plugins.open_tech_quest import demo\nfrom CTFd.plugins.open_tech_quest.models import (\n\
    \    QuestEvent, QuestOnboarding, QuestReadiness, QuestRoom, QuestStart,\n    QuestStep, QuestTeamName,\n\
    )\n\nassert os.environ.get(\"QUEST_LOADTEST\") == \"isolated-20261106\"\nassert os.environ[\"DATABASE_URL\"\
    ].rsplit(\"/\", 1)[-1] == \"quest_loadtest_test\"\napp = create_app()\nwith app.app_context():\n \
    \   assert Users.query.count() == Teams.query.count() == Challenges.query.count() == 0\n    at = datetime.utcnow()\
    \ - timedelta(hours=1)\n    for key, value in (\n        (\"setup\", True), (\"ctf_name\", \"DISPOSABLE\
    \ Open Tech Quest load test\"),\n        (\"user_mode\", \"teams\"), (\"challenge_visibility\", \"\
    public\"),\n        (\"account_visibility\", \"public\"), (\"verify_emails\", False),\n        (\"\
    registration_visibility\", \"public\"), (\"paused\", False),\n        (\"start\", int(at.timestamp())),\
    \ (\"end\", None),\n    ):\n        set_config(key, value)\n    event = QuestEvent.query.get(1)\n\
    \    batch = demo.load(event)\n    # Test-only fixture: preserve actual demo content but retire its\
    \ preview\n    # marker. Production's start guard is unchanged and is never bypassed there.\n    batch.active,\
    \ batch.active_slot, batch.removed_at = False, None, at\n    event.status, event.start_at = \"live\"\
    , at\n    state = QuestOnboarding.query.get(1)\n    state.phase, state.team_size, state.grandfathered\
    \ = \"finalized\", 8, True\n    state.finalized_at, state.attendance_open = at, False\n    password\
    \ = hash_password(Path(\"/runtime/participant-password\").read_text().strip())\n    db.session.execute(Users.__table__.insert(),\
    \ {\n        \"id\": 1, \"name\": \"load-organizer\", \"email\": \"organizer@example.test\",\n   \
    \     \"password\": password, \"type\": \"admin\", \"verified\": True,\n        \"banned\": False,\
    \ \"hidden\": False,\n    })\n    rooms = QuestRoom.query.order_by(QuestRoom.position).all()\n   \
    \ steps = {room.id: QuestStep.query.filter_by(room_id=room.id).order_by(QuestStep.position).all()\
    \ for room in rooms}\n    for index in range(50):\n        team = Teams(name=f\"Synthetic team {index\
    \ + 1:02}\")\n        db.session.add(team)\n        db.session.flush()\n        rows = [{\n      \
    \      \"id\": 2 + index * 8 + member, \"name\": f\"load-user-{index * 8 + member + 1:03}\",\n   \
    \         \"email\": f\"load-{index * 8 + member + 1:03}@example.test\",\n            \"password\"\
    : password, \"type\": \"user\", \"verified\": True,\n            \"banned\": False, \"hidden\": False,\
    \ \"team_id\": team.id,\n        } for member in range(8)]\n        db.session.execute(Users.__table__.insert(),\
    \ rows)\n        team.captain_id = rows[0][\"id\"]\n        db.session.add(QuestTeamName(team_id=team.id,\
    \ name_locked=True, auto_named=True))\n        for row in rows:\n            db.session.add(QuestReadiness(user_id=row[\"\
    id\"], ready_at=at))\n        for rindex, room in enumerate(rooms):\n            start = at + timedelta(minutes=1\
    \ + rindex)\n            db.session.add(QuestStart(team_id=team.id, room_id=room.id, started_at=start))\n\
    \            count = (index + rindex * 2) % 5  # leave one native challenge open in every room\n \
    \           for step in steps[room.id][:count]:\n                db.session.add(Solves(\n        \
    \            challenge_id=step.challenge_id, user_id=rows[0][\"id\"],\n                    team_id=team.id,\
    \ date=start + timedelta(seconds=30 * (step.position + 1)),\n                ))\n    db.session.commit()\n\
    \    cache.clear()\n    # Private runtime fixture mapping; never expose through HTTP or log flags.\n\
    \    mapping = [{\"slug\": r.slug, \"id\": r.id, \"steps\": [\n        {\"id\": s.challenge_id, \"\
    flag\": Flags.query.filter_by(challenge_id=s.challenge_id).one().content}\n        for s in steps[r.id]\n\
    \    ]} for r in rooms]\n    Path(\"/runtime/challenges.json\").write_text(json.dumps(mapping))\n\
    \    print(json.dumps({\"fixture\": \"isolated-20261106\", \"participants\": 400,\n              \
    \        \"teams\": Teams.query.count(), \"challenges\": Challenges.query.count(),\n             \
    \         \"solves\": Solves.query.count(), \"room_starts\": QuestStart.query.count()}))\n"
  metrics.py: "\"\"\"Small sampler executed only in the disposable app container.\"\"\"\nimport json\n\
    import os\nimport time\nfrom pathlib import Path\nimport pymysql\nimport redis\n\ndef read(path):\n\
    \    try:\n        return Path(path).read_text().strip()\n    except OSError:\n        return None\n\
    \nout={'timestamp':time.time(),'cgroup':{n:read('/sys/fs/cgroup/'+n) for n in [\n    'cpu.stat','cpu.max','memory.current','memory.peak','memory.events','memory.stat','memory.max','io.stat'\n\
    ]}}\ntry:\n    conn=pymysql.connect(host='127.0.0.1',user='ctfd_loadtest',password=read('/runtime/db-password'),database='quest_loadtest_test',connect_timeout=2,read_timeout=2)\n\
    \    with conn.cursor() as c:\n        c.execute(\"SHOW GLOBAL STATUS WHERE Variable_name IN ('Questions','Queries','Threads_connected','Threads_running','Max_used_connections','Slow_queries','Innodb_row_lock_waits','Innodb_row_lock_time','Innodb_buffer_pool_reads','Innodb_buffer_pool_read_requests','Bytes_received','Bytes_sent','Aborted_connects')\"\
    )\n        out['database']={k:int(v) for k,v in c.fetchall()}\n    conn.close()\nexcept Exception\
    \ as e:\n    out['database_error']=type(e).__name__\ntry:\n    info=redis.Redis(host='127.0.0.1',password=read('/runtime/redis-password'),socket_connect_timeout=2,socket_timeout=2).info()\n\
    \    out['redis']={k:info[k] for k in ['used_memory','used_memory_peak','connected_clients','total_commands_processed','instantaneous_ops_per_sec','evicted_keys','keyspace_hits','keyspace_misses']}\n\
    except Exception as e:\n    out['redis_error']=type(e).__name__\nout['sampler_duration_s']=time.time()-out['timestamp']\n\
    print(json.dumps(out))\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd-loadtest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ctfd-loadtest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctfd-loadtest
        app.kubernetes.io/part-of: ctfd-loadtest
      annotations:
        loadtest.open-tech-quest/profile: current
    spec:
      serviceAccountName: ctfd-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - imagePullPolicy: IfNotPresent
        securityContext: &id001
          allowPrivilegeEscalation: false
          capabilities: &id002
            drop:
            - ALL
        name: credentials
        image: ghcr.io/open-tech-quest/ctfd-plugin:0.1.16@sha256:e3c482115fbd99609068177a8f9fbc9f0c645744f9199fb5733c5eb2ce8bea6d
        command:
        - python
        - -c
        - from pathlib import Path; import secrets,os; p=Path('/runtime'); [(p/n).write_text(secrets.token_hex(32))
          for n in ['db-root','db-password','redis-password','secret-key','participant-password']]; [os.chmod(f,0o644)
          for f in p.iterdir()]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: runtime
          mountPath: /runtime
      containers:
      - imagePullPolicy: IfNotPresent
        securityContext: *id001
        name: ctfd
        image: ghcr.io/open-tech-quest/ctfd-plugin:0.1.16@sha256:e3c482115fbd99609068177a8f9fbc9f0c645744f9199fb5733c5eb2ce8bea6d
        command:
        - /bin/sh
        - -ec
        args:
        - '

          set -eu

          export SECRET_KEY="$(cat /runtime/secret-key)"

          export DATABASE_URL="mysql+pymysql://ctfd_loadtest:$(cat /runtime/db-password)@127.0.0.1:3306/quest_loadtest_test"

          export REDIS_URL="redis://:$(cat /runtime/redis-password)@127.0.0.1:6379/0"

          printf ''\nSESSION_COOKIE_SECURE =\n'' >> /opt/CTFd/CTFd/config.ini

          python ping.py

          flask db upgrade

          PYTHONPATH=/opt/CTFd python /fixture/fixture.py

          exec /opt/CTFd/docker-entrypoint.sh

          '
        env:
        - name: QUEST_LOADTEST
          value: isolated-20261106
        - name: WORKERS
          value: '2'
        - name: REVERSE_PROXY
          value: 1,1,1,0,0
        - name: SESSION_COOKIE_SECURE
          value: 'true'
        - name: UPLOAD_FOLDER
          value: /var/uploads
        - name: LOG_FOLDER
          value: /var/log/CTFd
        - name: ACCESS_LOG
          value: '-'
        - name: ERROR_LOG
          value: '-'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /login
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /login
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: runtime
          mountPath: /runtime
        - name: fixture
          mountPath: /fixture
        - name: uploads
          mountPath: /var/uploads
        - name: logs
          mountPath: /var/log/CTFd
      - imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id002
          runAsUser: 999
          runAsGroup: 999
        name: mariadb
        image: docker.io/library/mariadb:10.11.19@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --wait-timeout=28800
        - --log-warnings=0
        env:
        - name: MARIADB_DATABASE
          value: quest_loadtest_test
        - name: MARIADB_USER
          value: ctfd_loadtest
        - name: MARIADB_PASSWORD_FILE
          value: /runtime/db-password
        - name: MARIADB_ROOT_PASSWORD_FILE
          value: /runtime/db-root
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: runtime
          mountPath: /runtime
          readOnly: true
        - name: database
          mountPath: /var/lib/mysql
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 10
          timeoutSeconds: 5
      - imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id002
          runAsUser: 999
          runAsGroup: 999
        name: redis
        image: docker.io/library/redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        command:
        - /bin/sh
        - -ec
        args:
        - exec redis-server --appendonly yes --requirepass "$(cat /runtime/redis-password)"
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: runtime
          mountPath: /runtime
          readOnly: true
        - name: cache
          mountPath: /data
      volumes:
      - name: runtime
        emptyDir:
          sizeLimit: 32Mi
      - name: database
        emptyDir:
          sizeLimit: 2Gi
      - name: cache
        emptyDir:
          sizeLimit: 512Mi
      - name: uploads
        emptyDir:
          sizeLimit: 256Mi
      - name: logs
        emptyDir:
          sizeLimit: 256Mi
      - name: fixture
        configMap:
          name: ctfd-loadtest-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: ctfd-loadtest
spec:
  selector:
    app.kubernetes.io/name: ctfd-loadtest
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ctfd-loadtest
spec:
  host: otq-loadtest.apps.ocp.kounex.com
  to:
    kind: Service
    name: ctfd-loadtest
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctfd-loadtest
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ctfd-loadtest
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 8000
