apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ctfd
  annotations:
    # Backup admission/download preparation can outlast ordinary page requests.
    haproxy.router.openshift.io/timeout: 10m
spec:
  to:
    kind: Service
    name: ctfd
  port:
    targetPort: http
  # No embedded certificate: use the ingress controller's wildcard cert.
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
