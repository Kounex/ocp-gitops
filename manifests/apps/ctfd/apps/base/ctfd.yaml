apiVersion: v1
kind: Service
metadata:
  name: ctfd
spec:
  selector:
    app.kubernetes.io/name: ctfd
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
spec:
  replicas: 1
  # One writer and no competing migrations against the RWO volume/database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ctfd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctfd
    spec:
      serviceAccountName: ctfd-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize
          image: ghcr.io/kounex/open-tech-quest:0.1.3@sha256:2e67f055fd565c6602a1fd50f0fcaa845d3cc5ecbaeac6997024d45573d806b3
          command: [/bin/sh, -ec]
          args:
            - |
              # CTFd 3.8.9 reads extra environment settings only when listed
              # in config.ini. Its final section is [extra].
              printf '\nSESSION_COOKIE_SECURE =\n' >> /opt/CTFd/CTFd/config.ini
              python ping.py
              flask db upgrade
              PYTHONPATH=/opt/CTFd python /bootstrap/bootstrap.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: ctfd-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: REDIS_URL
            - name: CTFD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: CTFD_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/uploads
              subPath: uploads
            - name: data
              mountPath: /var/log/CTFd
              subPath: logs
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: ctfd
          image: ghcr.io/kounex/open-tech-quest:0.1.3@sha256:2e67f055fd565c6602a1fd50f0fcaa845d3cc5ecbaeac6997024d45573d806b3
          command: [/bin/sh, -ec]
          args:
            - |
              # Each container has its own writable config.ini.
              printf '\nSESSION_COOKIE_SECURE =\n' >> /opt/CTFd/CTFd/config.ini
              exec /opt/CTFd/docker-entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: ctfd-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ctfd-secrets
                  key: REDIS_URL
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/uploads
              subPath: uploads
            - name: data
              mountPath: /var/log/CTFd
              subPath: logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ctfd-data
        - name: bootstrap
          configMap:
            name: ctfd-bootstrap
