apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backup-argo.yaml
  - backup-worker-route.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: lvms-vg1
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ctfd
    patch: |
      - op: add
        path: /spec/host
        value: otq.apps.ocp.kounex.com
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.63@sha256:034275a9b35708e73ab08a3ada4493e1ffcdc6484b24cd23b6415a12710c15bd
