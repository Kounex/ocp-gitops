apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: lvms-vg1
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ctfd
    patch: |
      - op: add
        path: /spec/host
        value: otq.apps.ocp.kounex.com
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.39@sha256:54a1d27a52140d02b7fa55171bd4d51b294699adabedc8e9f670ea00aa6b2644
