apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: lvms-vg1
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ctfd
    patch: |
      - op: add
        path: /spec/host
        value: otq.apps.ocp.kounex.com
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.38@sha256:929b308383fdc4661ee4be84680e2c0d40f6067101d4ba15b307eac7fe24f27f
