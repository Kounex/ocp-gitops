apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backup-argo.yaml
  - backup-worker-route.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: lvms-vg1
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ctfd
    patch: |
      - op: add
        path: /spec/host
        value: otq.apps.ocp.kounex.com
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.43@sha256:75ab148996fa605e5d7915955889515fbdb1c7659ab3c1a7dd93b61bd4e14cd1
