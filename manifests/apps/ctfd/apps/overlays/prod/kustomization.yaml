apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      - op: add
        path: /spec/storageClassName
        value: lvms-vg1
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ctfd
    patch: |
      - op: add
        path: /spec/host
        value: otq.apps.ocp.kounex.com
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.33@sha256:b97bd32d2408f7ba6bcb09ae4c8a7e7c066830e840f233dfe66ba088960b1584
