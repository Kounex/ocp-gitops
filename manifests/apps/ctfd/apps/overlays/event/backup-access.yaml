apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctfd-backup
automountServiceAccountToken: false
---
# External backup runner; revoke by deleting this Secret at event teardown.
# The controller supplies the token. No credential value belongs in Git.
apiVersion: v1
kind: Secret
metadata:
  name: ctfd-backup-token
  annotations:
    kubernetes.io/service-account.name: ctfd-backup
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctfd-backup
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['ctfd', 'database', 'cache']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods/exec']
    verbs: ['create']
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['ctfd-secrets']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['configmaps', 'persistentvolumeclaims', 'services']
    verbs: ['get', 'list']
  - apiGroups: ['route.openshift.io']
    resources: ['routes']
    resourceNames: ['ctfd']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctfd-backup
subjects:
  - kind: ServiceAccount
    name: ctfd-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctfd-backup
