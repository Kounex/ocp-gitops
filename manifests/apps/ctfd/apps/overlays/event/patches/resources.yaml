apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
spec:
  template:
    spec:
      containers:
        - name: ctfd
          resources:
            requests:
              cpu: '4'
              memory: 1Gi
            limits:
              cpu: '6'
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  template:
    spec:
      containers:
        - name: mariadb
          # The event cluster stays on MariaDB 10.11 LTS (supported to 2028-02):
          # CTFd's migrations fail on an empty 12.x database (CTFd#2916), which
          # would break fresh installs here and in cluster/event/loadtest. See
          # the ctfd README. A 12.x data directory can't go back to 10.11.
          image: docker.io/library/mariadb:10.11.19@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
