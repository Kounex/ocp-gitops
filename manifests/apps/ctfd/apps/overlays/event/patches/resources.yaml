apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
spec:
  template:
    spec:
      containers:
        - name: ctfd
          resources:
            requests:
              cpu: '4'
              memory: 1Gi
            limits:
              cpu: '6'
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  template:
    spec:
      containers:
        - name: mariadb
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
