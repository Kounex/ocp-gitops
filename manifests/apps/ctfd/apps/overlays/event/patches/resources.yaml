apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
spec:
  template:
    spec:
      containers:
        - name: ctfd
          resources:
            requests:
              cpu: '4'
              memory: 1Gi
            limits:
              cpu: '6'
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  template:
    spec:
      containers:
        - name: mariadb
          # The event cluster stays on MariaDB 10.11 LTS (supported to 2028-02)
          # until its own upgrade is decided: back up its database on that
          # cluster first, because a 12.x data directory can't go back to 10.11.
          image: docker.io/library/mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
