apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: ctfd-config
    behavior: merge
    literals:
      - WORKERS=8
      # CTFd 3.8.9 / Flask-SQLAlchemy uses a 10-connection MySQL pool.
      # Eight workers can open at most 8 * 10 = 80 connections,
      # leaving room below MariaDB's default max_connections of 151.
      - SQLALCHEMY_MAX_OVERFLOW=0
patches:
  - path: patches/resources.yaml
images:
  - name: ctfd
    newName: ghcr.io/open-tech-quest/ctfd-plugin
    newTag: 0.1.32@sha256:6cf498ce81b7ea224479cce4a0c9f2d06a40771de86cc92013625472c8694a19
