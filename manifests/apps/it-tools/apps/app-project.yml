apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: it-tools
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '210'
spec:
  sourceRepos:
    - https://bjw-s-labs.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: it-tools
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
