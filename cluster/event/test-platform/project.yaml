apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ctfd-event-loadtest
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: '190'
spec:
  description: Disposable Open Tech Quest capacity test, separate from event data
  sourceRepos:
    - https://github.com/Kounex/ocp-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ctfd-loadtest
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
