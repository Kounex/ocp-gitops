apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd-load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctfd-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctfd-load-generator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: docker.io/library/node:26.13.0-slim@sha256:6f3406bb40734a2cbe3c78c3a5d9a467113b41b7a4c653a8d0534a276c67afdf
          command: [node, -e, 'setTimeout(() => {}, 86400000)']
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '4'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: source
              mountPath: /loadgen
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: ctfd-cold-diagnostic
